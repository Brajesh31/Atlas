<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">Atlas architecture overview</title><desc id="d">Browser connects to Node HTTP server, Express middleware and routes; route handlers render EJS and use Mongoose to access MongoDB. Static CSS and JavaScript are served separately.</desc>
