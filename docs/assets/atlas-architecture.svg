<rect width="1100" height="560" rx="22" fill="url(#bg)"/>
<text x="48" y="54" fill="#f8fafc" font-family="Arial" font-size="28" font-weight="700">ATLAS • CURRENT SYSTEM BOUNDARIES</text>
<g font-family="Arial" text-anchor="middle">
<rect x="45" y="220" width="175" height="95" rx="14" fill="#1e3a8a" stroke="#93c5fd"/><text x="132" y="258" fill="white" font-size="19" font-weight="700">Browser</text><text x="132" y="284" fill="#dbeafe" font-size="14">Forms + HTML</text>
<rect x="295" y="220" width="175" height="95" rx="14" fill="#115e59" stroke="#5eead4"/><text x="382" y="258" fill="white" font-size="19" font-weight="700">Node HTTP</text><text x="382" y="284" fill="#ccfbf1" font-size="14">bin/www</text>
<rect x="545" y="220" width="190" height="95" rx="14" fill="#164e63" stroke="#67e8f9"/><text x="640" y="258" fill="white" font-size="19" font-weight="700">Express</text><text x="640" y="284" fill="#cffafe" font-size="14">app.js + middleware</text>
<rect x="820" y="105" width="230" height="95" rx="14" fill="#4c1d95" stroke="#c4b5fd"/><text x="935" y="142" fill="white" font-size="19" font-weight="700">EJS Views</text><text x="935" y="168" fill="#ede9fe" font-size="14">views/*.ejs</text>
<rect x="820" y="330" width="230" height="95" rx="14" fill="#854d0e" stroke="#fde68a"/><text x="935" y="368" fill="white" font-size="19" font-weight="700">Mongoose</text><text x="935" y="394" fill="#fef3c7" font-size="14">Model + query</text>
