name: 📝 Documentation improvement
description: Report missing, unclear, or inaccurate Atlas documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: document
    attributes:
      label: Document path
      placeholder: docs/architecture.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is inaccurate or missing?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
