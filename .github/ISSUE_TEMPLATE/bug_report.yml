name: 🐛 Bug report
description: Report a reproducible Atlas defect.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, database URIs, cookies, or personal data. Report security vulnerabilities privately using SECURITY.md."
  - type: input
    id: route
    attributes:
      label: Route
      description: HTTP method and path, for example GET /sign.
      placeholder: GET /sign
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js and npm versions
      placeholder: Node 20.x, npm 10.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start local app\n2. Open route\n3. Submit synthetic form data"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, cookies, and real account details.
